# Fly.io app for the lookup server, London region.
# COST: ~$2.48/month for the always-on shared-cpu-1x 256 MB machine in London (Fly's $2.19 base price
# x 1.13 for lhr, checked 6 Oct 2026), plus the 13 GB volume at ~$1.95/month (~$0.15/GB).
app = "<your-app>"   # copy to fly.toml and set your Fly app name; fly.toml is git-ignored
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  SHARD_COUNT = "8192"

[http_service]
  internal_port = 8080
  force_https = true
  # Always on. iOS waits only about 1 second for the block answer, then lets the phone ring
  # (phone log, 6 Oct 2026: timeout after 1.006 s). Waking from suspend took 0.8 s, so the
  # answer arrived 15 ms too late. "suspend" saves ~$2.30/month but misses calls like that one.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/config"

[mounts]
  source = "pirdata"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
